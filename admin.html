<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Kesh Atelier Bookings</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400&family=Instrument+Sans:wght@400;500&family=DM+Mono&display=swap">
<style>
:root{color-scheme:dark;--ink:#171412;--ink-2:#1f1b18;--gold:#c6a165;--fg:#f2ece4;--mist:#aaa197;--line:rgba(242,236,228,.13)}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;background:var(--ink);color:var(--fg);font:15px/1.5 "Instrument Sans",Arial,sans-serif;padding:32px max(16px,4vw)}
h1{font:400 2rem "Playfair Display",Georgia,serif;margin:0 0 4px}
p{color:var(--mist);margin:0 0 20px}
form{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:24px}
input{font:inherit;color:var(--fg);background:var(--ink-2);border:1px solid var(--line);padding:10px 12px;min-width:260px}
button{font:inherit;font-weight:500;background:var(--gold);color:var(--ink);border:0;padding:10px 18px;cursor:pointer}
.wrap{overflow-x:auto;border:1px solid var(--line)}
table{border-collapse:collapse;width:100%;min-width:900px}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
th{font:12px "DM Mono",monospace;letter-spacing:.12em;text-transform:uppercase;color:var(--mist);font-weight:400}
td.ref{font-family:"DM Mono",monospace;color:var(--gold)}
.tag{font:11px "DM Mono",monospace;padding:2px 6px;border:1px solid var(--line);color:var(--mist)}
.tag.ava{border-color:var(--gold);color:var(--gold)}
#msg{color:#f0a58b}
</style>
</head>
<body>
<h1>Booking requests</h1>
<p>Newest first. Requests from the website form and from Ava, the voice receptionist.</p>
<form id="f"><label for="k" hidden>Admin key</label><input id="k" type="password" placeholder="Admin key" autocomplete="current-password" required><button>Show bookings</button></form>
<p id="msg" role="alert" hidden></p>
<div class="wrap" id="wrap" hidden><table><thead><tr><th>Ref</th><th>When</th><th>Service</th><th>Stylist</th><th>Name</th><th>Phone</th><th>Email</th><th>Notes</th><th>From</th><th>Received</th></tr></thead><tbody id="rows"></tbody></table></div>
<script>
const f = document.getElementById('f'), k = document.getElementById('k'), msg = document.getElementById('msg');
try { k.value = sessionStorage.getItem('ka-admin') || ''; } catch (e) {}
const t12 = hm => { let [h, m] = hm.split(':').map(Number); const ap = h >= 12 ? 'PM' : 'AM'; h = h % 12 || 12; return `${h}:${String(m).padStart(2, '0')} ${ap}`; };
const day = iso => new Date(iso + 'T12:00:00Z').toLocaleDateString('en-US', { timeZone: 'UTC', weekday: 'short', month: 'short', day: 'numeric' });
f.addEventListener('submit', async e => {
  e.preventDefault(); msg.hidden = true;
  try { sessionStorage.setItem('ka-admin', k.value); } catch (e) {}
  const r = await fetch('/api/bookings', { headers: { 'x-admin-key': k.value } });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) { msg.textContent = j.error || 'Could not load bookings.'; msg.hidden = false; return; }
  const tb = document.getElementById('rows'); tb.innerHTML = '';
  j.bookings.forEach(b => {
    const tr = document.createElement('tr');
    [[b.ref, 'ref'], [`${day(b.date)}, ${t12(b.time)}`], [b.service], [b.stylist], [b.name], [b.phone], [b.email || ''], [b.notes || ''], [null], [new Date(b.createdAt).toLocaleString('en-US', { timeZone: 'America/Denver' })]]
      .forEach(([v, cls]) => { const td = document.createElement('td'); if (cls) td.className = cls;
        if (v === null) { const s = document.createElement('span'); s.className = 'tag ' + (b.source === 'ava' ? 'ava' : ''); s.textContent = b.source === 'ava' ? 'Ava' : 'Website'; td.append(s); }
        else td.textContent = v; tr.append(td); });
    tb.append(tr);
  });
  if (!j.bookings.length) { msg.textContent = 'No booking requests yet.'; msg.hidden = false; }
  document.getElementById('wrap').hidden = !j.bookings.length;
});
</script>
</body>
</html>
